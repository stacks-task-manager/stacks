<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Verify email address - Stacks</title>
        <link rel="stylesheet" href="/static/assets/css/stacks.min.css" as="style" />
    </head>
    <body>
        <div class="d-flex flex__center ps-fixed t0 b0 l0 r0 bg-theme-secondary-100 overflow-y-auto">
            <div class="s-card ws4 bs-lg">
                <form method="post" action="/auth/email-change/confirm">
                    <input type="hidden" name="csrf" value="{{csrf}}" />
                    <input type="hidden" name="token" value="{{token}}" />
                    <h2 class="ta-center">Verify email address</h2>
                    <p class="fs-body3 fc-medium">
                        Confirm that you want to use this address to sign in to your Stacks account.
                    </p>
                    <button class="s-btn s-btn__filled s-btn mt24" type="submit">
                        Confirm email address
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
